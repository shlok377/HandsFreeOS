[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handsfree-os"
version = "0.1.0"
description = "Hands-free real-time voice and vision operating system control for Linux/Hyprland"
authors = [{ name = "Shlok" }]
readme = "SPEC.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
handsfree = "handsfree.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["handsfree*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

